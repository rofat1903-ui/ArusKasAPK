
name: Build Couple Money APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q ArusKasAndroid_CoupleMoney_Project_GitHubActions.zip -d build-project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: build-project/ArusKasAndroid
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: couple-money-debug-apk
          path: build-project/ArusKasAndroid/app/build/outputs/apk/debug/app-debug.apk
